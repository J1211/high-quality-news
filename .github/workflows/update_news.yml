name: Hourly High-Quality News Filter

on:
  schedule:
    - cron: '15 0-16,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-score:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装依赖
        run: pip install -r requirements.txt

      - name: 4. 运行抓取与 AI 严审脚本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python fetch_and_score.py

      - name: 5. 自动提交数据并防止 Git 历史膨胀
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add high_quality_news.json seen_urls.json status.json trending_news.json trending_snapshot.json || true
          if ! git diff --staged --quiet; then
            LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
            if [ "$LAST_AUTHOR" = "github-actions[bot]" ]; then
              git commit --amend -m "Auto-update high quality news ($(date -u +'%Y-%m-%d %H:%M UTC')) [skip ci]"
              git push --force
            else
              git commit -m "Auto-update high quality news ($(date -u +'%Y-%m-%d %H:%M UTC')) [skip ci]"
              git push
            fi
          fi
